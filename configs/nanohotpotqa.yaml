# One config per reported run. The manifest records this file verbatim.
dataset:
  name: nanohotpotqa
  split: test
  frozen: true
  data_dir: data

index:
  parser: auto
  summarizer_model: gpt-4.1-mini
  allow_llm_inferred_structure: false  # flip only for an explicitly labelled run
  path: index/nanohotpotqa
  cache_dir: .cache/summaries

answering:
  model: gpt-4.1
  max_context_chars: 6000
  max_nodes: 5

jev:
  model: jev-latest        # the resolved versioned ID is recorded per expansion
  rate_per_million: 0.042
  max_spend_usd: 0.0       # raise explicitly; zero blocks every paid call
  max_concurrency: 8

llm:
  max_spend_usd: 0.0       # covers summaries, arm C, the fallback and the answering model
  max_concurrency: 4
  pricing:                 # USD per million tokens, from the provider's pricing page on the
                           # date in the manifest; a model missing here is reported unpriced
    gpt-4.1-mini: {input_per_million: 0.40, output_per_million: 1.60}
    gpt-4.1: {input_per_million: 2.00, output_per_million: 8.00}

thresholds:
  source: configs/thresholds/nanohotpotqa-dev.json   # must be fitted on dev, not test

arms: [A, B, C, D, E]

baselines:
  dense:
    embedding_model: text-embedding-3-large
    reranker_model: BAAI/bge-reranker-v2-m3
    chunk_chars: 1200
    chunk_overlap: 200
    rerank_candidates: 20
    embedding_rate_per_million: 0.13
  llm_traversal:
    model: gpt-4.1           # a capable non-reasoning model: a reasoning model would inflate
                             # arm C's latency and flatter the hypothesis

fallback:                  # arm E
  model: gpt-4.1
  max_escalations_per_query: 3

stats:
  bootstrap_resamples: 10000
  seed: 0

results_dir: results
