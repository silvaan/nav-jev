[project]
name = "nav-jev"
version = "0.0.0"
description = "Hierarchical embedding-free retrieval with a System One traversal policy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Silvan Ferreira", email = "sjrmiranda@gmail.com" }]
dependencies = [
    "typesafe-sdk>=0.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "anthropic>=1.7.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.3"]
eval = ["datasets>=2.19"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
nav-jev = "navjev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navjev"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "fitz", "rank_bm25", "datasets", "datasets.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
