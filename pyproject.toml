[project]
name = "nav-jev"
version = "0.1.0"
description = "Ask questions to long documents by walking their table of contents with Jev"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Silvan Ferreira", email = "sjrmiranda@gmail.com" }]
dependencies = [
    "typesafe-sdk>=0.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pymupdf>=1.24",
    "python-docx>=1.2.0",
    "anthropic>=1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
nav-jev = "navjev.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navjev"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true
